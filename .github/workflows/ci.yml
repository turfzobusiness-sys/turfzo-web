name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Least privilege for the whole job. The cross-repo backend checkout is the
    # only step that needs more than `contents: read`, and it gets that from
    # secrets.GH_PAT rather than from GITHUB_TOKEN (see the step below).
    permissions:
      contents: read

    steps:
      # ---------------------------------------------------------------------
      # SUPPLY CHAIN: every third-party action below is referenced by a
      # mutable tag/branch and MUST be pinned to a full commit SHA.
      # `actions/*` is first-party (GitHub-maintained) and is left as-is by
      # policy; the third-party entries are:
      #   - actions/checkout          (first-party, tag v4)
      #   - actions/setup-node        (first-party, tag v4)
      # Third-party refs to resolve before this job is trusted:
      #   gh api repos/actions/checkout/git/ref/tags/v4 --jq '.object.sha'
      #   gh api repos/actions/setup-node/git/ref/tags/v4 --jq '.object.sha'
      # Substitute the returned 40-hex SHAs for @v4 (annotate with the version
      # as a trailing comment, e.g. `@<sha> # v4.2.2`). A mutable tag means
      # whoever controls the upstream repo can repoint this job at new code
      # with the same GITHUB_TOKEN.
      # ---------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          # Do not write the GITHUB_TOKEN into .git/config. Nothing after this
          # step needs git credentials, and npm ci / lint / test / build must
          # not be able to read them off disk.
          persist-credentials: false

      - name: Checkout turfzo-backend (required for contract tests)
        # NOT continue-on-error. tests/convex-paths.test.ts verifies every
        # `convexClient.query("module:function")` string path in this website
        # against the backend's exported functions. If this checkout fails the
        # test file falls back to `it.skip` under CI, so a backend rename used
        # to merge with a green build. A failed checkout must fail the job.
        uses: actions/checkout@v4
        with:
          repository: shaikhakramshakil/turfzo-backend
          path: turfzo-backend
          token: ${{ secrets.GH_PAT || github.token }}
          # Same rationale as above: the cross-repo PAT is scoped to this one
          # step and is never written to disk for later steps to reuse.
          persist-credentials: false

      - name: Drop checkout credentials before build and test steps
        run: |
          set -euo pipefail
          leaked=0
          for cfg in .git/config turfzo-backend/.git/config; do
            [ -f "$cfg" ] || continue
            if grep -q 'extraheader' "$cfg"; then
              git config --file="$cfg" --remove-section 'http.https://github.com/.extraheader' 2>/dev/null || true
            fi
            if grep -q 'extraheader' "$cfg"; then
              echo "ERROR: a checkout credential is still persisted in $cfg" >&2
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            echo "Refusing to run npm ci / test / build with a checkout credential on disk." >&2
            exit 1
          fi
          echo "OK: no checkout credentials persisted on disk."

      - name: Require the backend checkout before running the contract tests
        run: |
          set -euo pipefail
          if [ ! -d turfzo-backend/convex ] || [ -z "$(ls -A turfzo-backend/convex 2>/dev/null)" ]; then
            echo "ERROR: turfzo-backend/convex is missing or empty." >&2
            echo "       tests/convex-paths.test.ts would skip the Convex path" >&2
            echo "       contract tests, so a backend rename or an inaccessible" >&2
            echo "       private repo would merge with green CI." >&2
            echo "       Fix the checkout (repository name + GH_PAT with read" >&2
            echo "       access to shaikhakramshakil/turfzo-backend) and re-run." >&2
            exit 1
          fi
          echo "OK: backend checkout present ($(ls turfzo-backend/convex | wc -l) entries in convex/)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        env:
          TURFZO_BACKEND_DIR: ${{ github.workspace }}/turfzo-backend
        run: npm run test

      - name: Build
        env:
          # Provide stub env vars so build doesn't crash on missing secrets.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-stub' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ci-stub' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'ci-stub.appspot.com' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '0' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '0:0:web:0' }}
          NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL || 'https://ci.convex.cloud' }}
          NEXT_PUBLIC_CASHFREE_APP_ID: ${{ secrets.NEXT_PUBLIC_CASHFREE_APP_ID || 'cf_test_ci' }}
        run: npm run build
