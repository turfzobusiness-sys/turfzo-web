name: Deploy Production to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm production rollout'
        required: true
        type: string
        default: ''

jobs:
  deploy-production:
    if: github.event.inputs.confirm == 'deploy-prod'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build with production environment
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'turfzo-prod.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'turfzo-prod' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'turfzo-prod.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '1060583963551' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:1060583963551:web:52df50b8a3f6a75b249baa' }}
          NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL || 'https://dependable-donkey-330.eu-west-1.convex.cloud' }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL || 'https://dependable-donkey-330.eu-west-1.convex.site' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://dependable-donkey-330.eu-west-1.convex.cloud' }}
          NEXT_PUBLIC_CASHFREE_APP_ID: ${{ secrets.NEXT_PUBLIC_CASHFREE_APP_ID }}
          NEXT_PUBLIC_CASHFREE_ENV: ${{ secrets.NEXT_PUBLIC_CASHFREE_ENV || 'production' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAA-placeholder' }}
          NEXT_PUBLIC_VIEW_ONLY_MODE: 'false'
        run: npm run build
      - run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'turfzo-prod.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'turfzo-prod' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'turfzo-prod.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '1060583963551' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:1060583963551:web:52df50b8a3f6a75b249baa' }}
          NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL || 'https://dependable-donkey-330.eu-west-1.convex.cloud' }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL || 'https://dependable-donkey-330.eu-west-1.convex.site' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://dependable-donkey-330.eu-west-1.convex.cloud' }}
          NEXT_PUBLIC_CASHFREE_APP_ID: ${{ secrets.NEXT_PUBLIC_CASHFREE_APP_ID }}
          NEXT_PUBLIC_CASHFREE_ENV: ${{ secrets.NEXT_PUBLIC_CASHFREE_ENV || 'production' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAA-placeholder' }}
          NEXT_PUBLIC_VIEW_ONLY_MODE: 'false'
      - name: Setup SOPS
        run: |
          sudo wget -qO /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          sudo chmod +x /usr/local/bin/sops
      - name: Decrypt and push secrets
        run: |
          sops decrypt .env.prod.enc > .env.prod
          npx wrangler secret bulk .env.prod
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3f24b8f35b25e0943b29f0035403f694
      - name: Deploy production worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3f24b8f35b25e0943b29f0035403f694