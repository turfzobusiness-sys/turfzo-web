name: Deploy Production to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm production rollout'
        required: true
        type: string
        default: ''

jobs:
  deploy-production:
    # Release authority. Both conditions must hold:
    #   1. the operator typed the exact confirmation string, and
    #   2. the dispatch was made from the protected default branch.
    # (2) is what stops a feature branch, or a PR head that happens to hold
    # the string "deploy-prod", from becoming the production bundle. Combined
    # with the pinned `ref: main` checkout below and the `production`
    # environment's branch restrictions, the deployed commit is always a
    # commit that already merged into main.
    if: github.event.inputs.confirm == 'deploy-prod' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `production` is the environment protection rule: required reviewers and
    # deployment branch restrictions are configured on the environment, not
    # here. Keep this key — it is what makes those restrictions apply.
    environment: production
    # Serialise production deploys: two concurrent rollouts racing the same
    # worker/route is how you end up promoting the older bundle.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read

    # Public, build-time config, defined once at job level so `npm run build`
    # and `npx opennextjs-cloudflare build` provably see identical values.
    # Previously these were duplicated per step, so editing one block and not
    # the other silently baked different config into the worker bundle.
    # CLOUDFLARE_API_TOKEN is deliberately NOT here — it stays scoped to the
    # deploy step below.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'turfzo-prod.firebaseapp.com' }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'turfzo-prod' }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'turfzo-prod.firebasestorage.app' }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '82964771406' }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:82964771406:web:1b733040a8a0e5490cc91f' }}
      NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL || 'https://dependable-donkey-330.eu-west-1.convex.cloud' }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL || 'https://dependable-donkey-330.eu-west-1.convex.site' }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://dependable-donkey-330.eu-west-1.convex.cloud' }}
      # No fallback on purpose: lib/env.ts treats this as required in
      # production, and a live payment app id must never be invented here.
      NEXT_PUBLIC_CASHFREE_APP_ID: ${{ secrets.NEXT_PUBLIC_CASHFREE_APP_ID }}
      NEXT_PUBLIC_CASHFREE_ENV: ${{ secrets.NEXT_PUBLIC_CASHFREE_ENV || 'production' }}
      # No placeholder fallback: the previous `|| '0x4AAAAAAA-placeholder'`
      # baked a dead Turnstile key into a production bundle. signup/login bot
      # gating then failed open or errored at runtime. The preflight step below
      # now fails the job when this is unset.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_VIEW_ONLY_MODE: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the protected default branch, not the dispatch ref. The
          # bundle is always built from main, never from whatever ref the
          # dispatch happened to name.
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ---------------------------------------------------------------------
      # Deploy preflight. Runs BEFORE any build or upload so a bundle that
      # would fail at runtime never gets built, let alone uploaded.
      # Mirrors PROD_REQUIRED in lib/env.ts, which is enforced at request time
      # and fails closed with an HTTP 500. Only names and presence are
      # reported — never values.
      # NOTE: this block is duplicated in deploy-staging.yml; keep them in sync.
      # ---------------------------------------------------------------------
      - name: Preflight — required public config
        run: |
          set -euo pipefail
          required=(
            NEXT_PUBLIC_FIREBASE_API_KEY
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
            NEXT_PUBLIC_FIREBASE_PROJECT_ID
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            NEXT_PUBLIC_FIREBASE_APP_ID
            NEXT_PUBLIC_CONVEX_DEPLOYMENT_URL
            NEXT_PUBLIC_CASHFREE_APP_ID
            NEXT_PUBLIC_TURNSTILE_SITE_KEY
          )
          missing=()
          placeholder=()
          for key in "${required[@]}"; do
            value="${!key-}"
            if [ -z "${value// /}" ]; then
              missing+=("$key")
            else
              # lib/env.ts and lib/turnstile.ts already treat any value
              # containing "placeholder" as unset. Reject it here rather than
              # shipping a bundle that is broken on arrival.
              lower="${value,,}"
              if [[ "$lower" == *placeholder* ]]; then
                placeholder+=("$key")
              fi
            fi
          done
          status=0
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Required public env var(s) unset — refusing to build or deploy."
            for key in "${missing[@]}"; do echo "  - $key (unset)"; done
            status=1
          fi
          if [ "${#placeholder[@]}" -gt 0 ]; then
            echo "::error::Required public env var(s) hold a placeholder value — refusing to build or deploy."
            for key in "${placeholder[@]}"; do echo "  - $key (placeholder)"; done
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "OK: all ${#required[@]} required public env vars set, none a placeholder."

      - name: Build with production environment
        run: npm run build

      - name: Bundle OpenNext worker
        run: npx opennextjs-cloudflare build

      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3f24b8f35b25e0943b29f0035403f694
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy --config wrangler.jsonc
          else
            echo "Skipping wrangler deploy: CLOUDFLARE_API_TOKEN is not configured in repository secrets."
          fi
