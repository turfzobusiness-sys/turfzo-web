name: Deploy Production to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-prod" to confirm production rollout'
        required: true
        type: string
        default: ''

jobs:
  deploy-production:
    if: github.event.inputs.confirm == 'deploy-prod'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx opennextjs-cloudflare build
      - name: Setup SOPS
        run: |
          sudo wget -qO /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          sudo chmod +x /usr/local/bin/sops
      - name: Decrypt and push secrets
        run: |
          sops decrypt .env.prod.enc > .env.prod
          npx wrangler secret bulk .env.prod
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3f24b8f35b25e0943b29f0035403f694
      - name: Deploy production worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3f24b8f35b25e0943b29f0035403f694